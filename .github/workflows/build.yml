name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the in-flight run for that branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Builds both modules: pxl-javax (release 8) and pxl-jakarta (release 17, sources generated
      # by string substitution from the sibling module). Tests tagged "network" reach an external
      # image host, so they are excluded to keep the run deterministic.
      - name: Build and test both modules
        run: mvn -B -ntp clean verify -DexcludedGroups=network

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
          if-no-files-found: ignore
